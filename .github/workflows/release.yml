name: Release

# Builds the Windows installer on GitHub's runner: the standalone app (PyInstaller) with
# FFmpeg, the restorer model and RAFT's weights, packed by Inno Setup. A tag such as
# v0.1.0 also makes a *draft* GitHub release with the installer and its SHA-256 attached
# and docs/release-notes/v0.1.0.md as the text; publishing it stays a manual step.
# Run it by hand (Actions > Release > Run workflow) to get the installer as an artifact.
#
# Needs the model as a release asset first (once per model): see docs/RELEASING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # only used to create the draft release on a tag

env:
  # BtbN's GPL shared build of the FFmpeg 9.0 branch (~87 MB zip, sources: ffmpeg.org).
  FFMPEG_ZIP: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-shared-9.0.zip

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked --group build --extra app

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(uv run --no-sync python -c "import anahd; print(anahd.__version__)")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
          test -f "docs/release-notes/v$version.md" || { echo "missing docs/release-notes/v$version.md"; exit 1; }

      - name: Check the third-party licence list is current
        run: uv run --no-sync python scripts/third_party.py --check

      - name: Download FFmpeg
        shell: bash
        run: |
          curl -L --fail -o ffmpeg.zip "$FFMPEG_ZIP"
          7z x -offmpeg ffmpeg.zip > /dev/null
          echo "FFMPEG_BIN=$(cygpath -w "$(ls -d "$PWD"/ffmpeg/*/bin)")" >> "$GITHUB_ENV"

      - name: Fetch the model (checked against its pinned SHA-256)
        run: uv run --no-sync python -c "from anahd.model.weights import resolve; print(resolve())"

      - name: Build the standalone app
        run: uv run --no-sync python scripts/build_windows.py --ffmpeg "${{ env.FFMPEG_BIN }}"

      - name: Smoke test the build (no GPU on the runner)
        shell: bash
        run: |
          "dist/AnaHD/anahd-cli.exe" --version
          "dist/AnaHD/ffmpeg/ffmpeg.exe" -hide_banner -version | head -1
          ls -la dist/AnaHD/models dist/AnaHD/models/torch/hub/checkpoints

      - name: Build the installer
        shell: bash
        env:
          MSYS_NO_PATHCONV: "1"  # keep /DAppVersion=... as an option, not a path
        run: |
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          test -x "$iscc" || choco install innosetup -y --no-progress
          version=$(uv run --no-sync python -c "import anahd; print(anahd.__version__)")
          "$iscc" "/DAppVersion=$version" packaging/installer.iss

      - name: Check the size (a GitHub release file must be under 2 GiB)
        shell: bash
        run: |
          size=$(stat -c %s dist/AnaHD-*-setup.exe)
          echo "installer: $size bytes"
          test "$size" -lt 2147483648 || { echo "installer is 2 GiB or more"; exit 1; }
          sha256sum dist/AnaHD-*-setup.exe | tee dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AnaHD-installer
          path: |
            dist/AnaHD-*-setup.exe
            dist/SHA256SUMS.txt
          retention-days: 7

      - name: Draft a release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          { cat "docs/release-notes/v$version.md"; echo; echo '**SHA-256**'; echo '```'; cat dist/SHA256SUMS.txt; echo '```'; } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/AnaHD-*-setup.exe dist/SHA256SUMS.txt \
            --draft --title "AnaHD $version" --notes-file notes.md
