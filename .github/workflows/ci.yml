name: CI

# Lint, types and the tests that need no GPU. The GPU tests (the whole pipeline on
# synthetic recordings) skip on GitHub's runners; run them locally with `uv run pytest`.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"

      - name: Install FFmpeg and Qt's system libraries (Linux)
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      # PyTorch (CUDA, ~2.5 GB) is left out: no GPU here, and the tests that need it skip.
      - name: Install dependencies
        run: >-
          uv sync --locked --extra app
          --no-install-package torch --no-install-package torchvision

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Format
        run: uv run --no-sync ruff format --check .

      - name: Type check
        run: uv run --no-sync mypy

      - name: Tests (no GPU)
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --no-sync pytest
